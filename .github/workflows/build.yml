name: อัปเดตข้อมูลหุ้น

on:
  # 21:30 UTC จันทร์-ศุกร์ = ประมาณ 1 ชั่วโมงหลังตลาดสหรัฐปิด (16:00 ET)
  # ตรงกับตี 4 ครึ่ง เวลาไทยของเช้าวันถัดไป (อังคาร-เสาร์)
  #   คืนวันจันทร์ตลาดปิด -> ได้ข้อมูลตอนตี 4 ครึ่งเช้าวันอังคารไทย
  #   คืนวันศุกร์ตลาดปิด  -> ได้ข้อมูลตอนตี 4 ครึ่งเช้าวันเสาร์ไทย
  schedule:
    - cron: "30 21 * * 1-5"
  # กดรันเองได้จากแท็บ Actions
  workflow_dispatch:
    inputs:
      period:
        description: "ช่วงข้อมูลย้อนหลัง (ต้องมากพอสำหรับ EMA200)"
        default: "3y"
      limit:
        description: "จำกัดจำนวนหุ้น (เว้นว่าง = ทั้งหมด, ใส่ 60 เพื่อทดลองเร็ว ๆ)"
        default: ""
      skip_fundamentals:
        description: "ข้ามข้อมูลพื้นฐาน (ใส่ yes ถ้าอยากได้ราคาเร็ว ๆ)"
        default: ""
      fund_limit:
        description: "ดึงข้อมูลพื้นฐานสูงสุดกี่ตัวรอบนี้ (เว้นว่าง = 300)"
        default: ""
      weekly:
        description: "บังคับคำนวณเส้นรายสัปดาห์ใหม่ (ใส่ yes)"
        default: ""

permissions:
  contents: write

concurrency:
  group: build-data

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: เช็กเอาต์โค้ด
        uses: actions/checkout@v4

      - name: ติดตั้ง Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ติดตั้งไลบรารี
        run: pip install pandas numpy yfinance PyYAML lxml

      - name: สร้างข้อมูล
        env:
          PERIOD: ${{ inputs.period || '3y' }}
          LIMIT: ${{ inputs.limit }}
          SKIPF: ${{ inputs.skip_fundamentals }}
          FLIM: ${{ inputs.fund_limit }}
          WEEKLY: ${{ inputs.weekly }}
        run: |
          ARGS="--period $PERIOD"
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          if [ -n "$SKIPF" ]; then ARGS="$ARGS --skip-fundamentals"; fi
          if [ -n "$FLIM" ]; then ARGS="$ARGS --fund-limit $FLIM"; fi
          if [ -n "$WEEKLY" ]; then ARGS="$ARGS --weekly"; fi
          python build.py $ARGS

      - name: อัปเดตเว็บไซต์
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # เพิ่มเฉพาะไฟล์ที่มีอยู่จริง
          # ถ้า git add ไปอ้างไฟล์ที่ไม่มี จะพังทั้งขั้นตอนด้วย exit code 128
          for f in docs/data.json docs/fundamentals.json docs/weekly.json docs/backtest.json docs/prev.json; do
            if [ -f "$f" ]; then
              git add -f "$f"
              echo "เพิ่ม $f"
            else
              echo "ข้าม $f (ยังไม่มีไฟล์)"
            fi
          done

          if git diff --quiet --cached; then
            echo "ข้อมูลไม่เปลี่ยน ไม่ต้องคอมมิต"
            exit 0
          fi

          git commit -m "ข้อมูล ณ $(date -u '+%Y-%m-%d %H:%M UTC')"

          # ลองส่งขึ้นสูงสุด 3 ครั้ง เผื่อมีการคอมมิตอื่นแทรกเข้ามาระหว่างนั้น
          for i in 1 2 3; do
            if git push; then
              echo "ส่งขึ้นสำเร็จ"
              exit 0
            fi
            echo "ส่งไม่สำเร็จ ลองดึงของใหม่มารวมแล้วส่งอีกครั้ง ($i/3)"
            git pull --rebase --autostash || true
            sleep 5
          done
          echo "::error::ส่งขึ้น GitHub ไม่สำเร็จหลังลอง 3 ครั้ง"
          exit 1

      - name: แจ้งเตือน Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py
        # ถ้ายังไม่ได้ตั้ง Secret สคริปต์จะข้ามไปเงียบ ๆ ไม่ทำให้ workflow ล้ม

      - name: เก็บไฟล์ไว้ดาวน์โหลด
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_number }}
          path: |
            docs/data.json
            docs/fundamentals.json
            docs/weekly.json
          retention-days: 14
