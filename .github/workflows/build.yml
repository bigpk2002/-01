name: อัปเดตข้อมูลหุ้น

on:
  # 01:00 UTC = 08:00 เช้าเวลาไทย
  # ใส่ 2-6 (อังคาร-เสาร์ ตามเวลา UTC) เพราะตลาดสหรัฐปิดคืนก่อนหน้า
  #   เช้าวันอังคารไทย = ได้ข้อมูลของวันจันทร์
  #   เช้าวันเสาร์ไทย  = ได้ข้อมูลของวันศุกร์
  schedule:
    - cron: "0 1 * * 2-6"
  # กดรันเองได้จากแท็บ Actions
  workflow_dispatch:
    inputs:
      period:
        description: "ช่วงข้อมูลย้อนหลัง (ต้องมากพอสำหรับ EMA200)"
        default: "3y"
      limit:
        description: "จำกัดจำนวนหุ้น (เว้นว่าง = ทั้งหมด, ใส่ 60 เพื่อทดลองเร็ว ๆ)"
        default: ""
      skip_fundamentals:
        description: "ข้ามข้อมูลพื้นฐาน (ใส่ yes ถ้าอยากได้ราคาเร็ว ๆ)"
        default: ""

permissions:
  contents: write

concurrency:
  group: build-data

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: เช็กเอาต์โค้ด
        uses: actions/checkout@v4

      - name: ติดตั้ง Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ติดตั้งไลบรารี
        run: pip install pandas numpy yfinance PyYAML lxml

      - name: สร้างข้อมูล
        env:
          PERIOD: ${{ inputs.period || '3y' }}
          LIMIT: ${{ inputs.limit }}
          SKIPF: ${{ inputs.skip_fundamentals }}
        run: |
          ARGS="--period $PERIOD"
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          if [ -n "$SKIPF" ]; then ARGS="$ARGS --skip-fundamentals"; fi
          python build.py $ARGS

      - name: อัปเดตเว็บไซต์
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/data.json docs/fundamentals.json
          if git diff --quiet --cached; then
            echo "ข้อมูลไม่เปลี่ยน ไม่ต้องคอมมิต"
          else
            git commit -m "ข้อมูล ณ $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash || true
            git push
          fi

      - name: แจ้งเตือน Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py
        # ถ้ายังไม่ได้ตั้ง Secret สคริปต์จะข้ามไปเงียบ ๆ ไม่ทำให้ workflow ล้ม

      - name: เก็บไฟล์ไว้ดาวน์โหลด
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_number }}
          path: |
            docs/data.json
            docs/fundamentals.json
          retention-days: 14
