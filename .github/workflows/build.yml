name: อัปเดตข้อมูลหุ้น

on:
  # 21:30 UTC จันทร์-ศุกร์ ≈ 1 ชม.หลังตลาดสหรัฐปิด (ประมาณ 04:30 เช้าเวลาไทย)
  schedule:
    - cron: "30 21 * * 1-5"
  # กดรันเองได้จากแท็บ Actions
  workflow_dispatch:
    inputs:
      period:
        description: "ช่วงข้อมูลย้อนหลัง (ต้องมากพอสำหรับ EMA200)"
        default: "3y"
      limit:
        description: "จำกัดจำนวนหุ้น (เว้นว่าง = ทั้งหมด, ใส่ 60 เพื่อทดลองเร็ว ๆ)"
        default: ""

permissions:
  contents: write

concurrency:
  group: build-data

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: เช็กเอาต์โค้ด
        uses: actions/checkout@v4

      - name: ติดตั้ง Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ติดตั้งไลบรารี
        run: pip install pandas numpy yfinance PyYAML lxml

      - name: สร้างข้อมูล
        env:
          PERIOD: ${{ inputs.period || '3y' }}
          LIMIT: ${{ inputs.limit }}
        run: |
          ARGS="--period $PERIOD"
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          python build.py $ARGS

      - name: อัปเดตเว็บไซต์
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/data.json
          if git diff --quiet --cached; then
            echo "ข้อมูลไม่เปลี่ยน ไม่ต้องคอมมิต"
          else
            git commit -m "ข้อมูล ณ $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash || true
            git push
          fi

      - name: เก็บไฟล์ไว้ดาวน์โหลด
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_number }}
          path: docs/data.json
          retention-days: 14
