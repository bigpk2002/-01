# ─────────────────────────────────────────────────────────────
#  แผนที่ธีมธุรกิจ AI  →  หุ้น
#
#  ไฟล์นี้คุณแก้เองได้เลย ไม่ต้องแตะโค้ด
#  แก้เสร็จรัน  python update.py --themes-only  เพื่ออัปเดตฐานข้อมูล
#
#  กติกา
#   - หุ้นตัวเดียวใส่ได้หลายธีม (เช่น MSFT อยู่ทั้ง cloud และ software)
#   - ใส่ได้เฉพาะหุ้นที่อยู่ใน S&P 500 หรือ Nasdaq 100
#     ถ้าใส่ตัวที่ไม่อยู่ในดัชนี โปรแกรมจะเตือนตอนรัน ไม่ปล่อยผ่านเงียบ ๆ
#   - order = ลำดับสำรอง ใช้เฉพาะตอนที่ค่า median เท่ากัน
#     ปกติหน้าเว็บจะเรียงกล่องตาม median ของกลุ่มอัตโนมัติ
# ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
#  หุ้นที่อยากติดตามเพิ่ม นอกเหนือจาก S&P 500 และ Nasdaq 100
#  ใส่ชื่อย่อลงในรายการนี้ ระบบจะดึงราคาและข้อมูลพื้นฐานให้เอง
#  ชื่อบริษัทกับหมวดธุรกิจเติมให้อัตโนมัติ ไม่ต้องกรอก
#  หุ้นที่เพิ่มที่นี่ ถ้าอยากให้โผล่ในหน้า AI Map ต้องใส่ในธีมด้านล่างด้วย
# ─────────────────────────────────────────────────────────────
extra: [NBIS, SNDK]

themes:

  - key: ai_chips
    name: ชิป AI / เซมิคอนดักเตอร์
    description: ผู้ออกแบบและผลิตชิปสำหรับงาน AI
    order: 1
    tickers: [NVDA, AMD, AVGO, MRVL, MU, INTC, QCOM, TXN, ADI, NXPI, ON, MPWR,
              MCHP, SWKS, TER, ARM, SNDK]  # หมายเหตุ: ON = ON Semiconductor · SNDK = SanDisk

