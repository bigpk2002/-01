# ─────────────────────────────────────────────────────────────
#  แผนที่ธีมธุรกิจ AI  →  หุ้น
#
#  ไฟล์นี้คุณแก้เองได้เลย ไม่ต้องแตะโค้ด
#  แก้เสร็จไปกด Run workflow บน GitHub เว็บจะอัปเดตตาม
#
#  กติกา
#   - หุ้นตัวเดียวใส่ได้หลายธีม (เช่น MSFT อยู่ทั้ง cloud และ ai_software)
#   - ชื่อคีย์ (key) ห้ามซ้ำกัน
#   - หุ้นที่ไม่อยู่ใน S&P 500 หรือ Nasdaq 100 ต้องใส่ในรายการ extra ก่อน
#   - ticker ที่เป็น ON NO Y N OFF ให้ใส่เครื่องหมายคำพูด เช่น "S"
#     เพราะ YAML จะตีความเป็นค่า true/false
# ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
#  หุ้นที่อยากติดตามเพิ่ม นอกเหนือจาก S&P 500 และ Nasdaq 100
#
#  กลุ่มนี้ส่วนใหญ่เป็นบริษัทขนาดเล็กที่ราคาแกว่งแรงกว่าหุ้นใหญ่หลายเท่า
#  บางตัวยังไม่มีกำไร จึงไม่มีค่า P/E ให้ดู
#  ตัวไหนไม่สนใจลบออกได้ อยากเพิ่มก็ใส่ชื่อย่อต่อท้าย
#  ถ้าตัวไหนดึงข้อมูลไม่ได้ ระบบจะรายงานชื่อไว้ในล็อกของ Actions
# ─────────────────────────────────────────────────────────────
extra: [
  # อวกาศ จรวด ดาวเทียม โดรน
  RKLB, ASTS, LUNR, RDW, PL, AVAV, KTOS, BWXT,

  # ชิป AI และอุปกรณ์เชื่อมต่อความเร็วสูง
  ALAB, CRDO, LSCC, AMBA, SITM, SNDK, WOLF, AEIS,

  # ดาต้าเซ็นเตอร์ AI รายใหม่ และผู้ให้เช่าพลัง GPU
  CRWV, NBIS, IREN, CORZ, APLD, WULF, CIFR, MOD, POWL,

  # นิวเคลียร์ขนาดเล็กและพลังงานป้อนดาต้าเซ็นเตอร์
  OKLO, SMR, BE,

  # ซอฟต์แวร์และบริการ AI
  BBAI, SOUN, TEM, PATH, "S", AI, RXRX, INOD,

  # คอมพิวเตอร์ควอนตัม
  IONQ, RGTI, QBTS, QUBT,

  # หุ่นยนต์และยานยนต์อัตโนมัติ
  SYM, SERV, OUST, ACHR, JOBY,
]

